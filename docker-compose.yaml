version: '3.8'
services:
  db: # Dịch vụ database
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Abc12345
      POSTGRES_DB: thienbut_hoanvu
    ports:
      - '5432:5432' # Ánh xạ cổng ra máy host để bạn có thể kết nối từ bên ngoài
volumes:
  pgdata:
