name: CI/CD Backend API (Build on Server)

# Kích hoạt workflow khi có code được push lên nhánh 'main'
on:
  push:
    branches: [ "main" ]

env:
  SERVICE_NAME: app # Tên service trong docker-compose.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Bước 1: Lấy mã nguồn (chỉ để biết commit, không dùng để build ở đây)
      - name: Checkout Code
        uses: actions/checkout@v4

      # Bước 2: SSH vào server, pull code và tự build
      - name: Deploy to Server and Build
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Di chuyển đến thư mục dự án
            cd /root/workspace/server/hoanvu-thienbut-server # <-- THAY ĐƯỜG DẪN ĐÚNG

            # Kéo code mới nhất từ nhánh main
            echo ">>> Pulling latest code from main branch..."
            git pull origin main

            # Build lại image cho service 'app' ngay trên server
            # Docker Compose sẽ đọc Dockerfile và tự build
            echo ">>> Building Docker image on server..."
            docker-compose build ${{ env.SERVICE_NAME }}

            # Khởi động lại service, bắt buộc tạo lại container để nhận image vừa build
            echo ">>> Restarting service..."
            docker-compose up -d --force-recreate --no-deps ${{ env.SERVICE_NAME }}

            # Dọn dẹp các image cũ không còn được sử dụng
            echo ">>> Pruning old Docker images..."
            docker image prune -f